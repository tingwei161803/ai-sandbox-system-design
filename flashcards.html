<header class="page-head"><h1>字卡 / 翻卡</h1><p class="page-head__sub">點一下卡片翻面。正面是術語，背面是意思。</p></header><div class="flip-grid" id="flips"><button class="flip" type="button" data-item="" aria-pressed="false"><div class="flip__inner"><div class="flip__face flip__front"><span>Namespace</span></div><div class="flip__face flip__back"><span>隔離行程「看得到什麼」（PID／網路／掛載／UTS）。</span></div></div></button><button class="flip" type="button" data-item="" aria-pressed="false"><div class="flip__inner"><div class="flip__face flip__front"><span>Cgroup</span></div><div class="flip__face flip__back"><span>限制行程「能用多少」（CPU／記憶體／I/O／PIDs）。</span></div></div></button><button class="flip" type="button" data-item="" aria-pressed="false"><div class="flip__inner"><div class="flip__face flip__front"><span>Seccomp-BPF</span></div><div class="flip__face flip__back"><span>過濾行程能做哪些 syscall —— 在執行前。</span></div></div></button><button class="flip" type="button" data-item="" aria-pressed="false"><div class="flip__inner"><div class="flip__face flip__front"><span>Timeout</span></div><div class="flip__face flip__back"><span>限制任務「能跑多久」；砍掉失控的。</span></div></div></button><button class="flip" type="button" data-item="" aria-pressed="false"><div class="flip__inner"><div class="flip__face flip__front"><span>沙盒執行層</span></div><div class="flip__face flip__back"><span>不可信程式碼真正執行的安全核心。</span></div></div></button><button class="flip" type="button" data-item="" aria-pressed="false"><div class="flip__inner"><div class="flip__face flip__front"><span>任務管理器</span></div><div class="flip__face flip__back"><span>派送任務到節點、監控、回傳結果。</span></div></div></button><button class="flip" type="button" data-item="" aria-pressed="false"><div class="flip__inner"><div class="flip__face flip__front"><span>資料庫的角色</span></div><div class="flip__face flip__back"><span>存 Job、Results、Logs —— 共享的真實來源。</span></div></div></button><button class="flip" type="button" data-item="" aria-pressed="false"><div class="flip__inner"><div class="flip__face flip__front"><span>OOM Killer</span></div><div class="flip__face flip__back"><span>記憶體耗盡時終止行程；cgroup memory.max 可觸發它。</span></div></div></button><button class="flip" type="button" data-item="" aria-pressed="false"><div class="flip__inner"><div class="flip__face flip__front"><span>TOCTOU</span></div><div class="flip__face flip__back"><span>檢查到使用的競態；seccomp-BPF 不解指標而避開。</span></div></div></button><button class="flip" type="button" data-item="" aria-pressed="false"><div class="flip__inner"><div class="flip__face flip__front"><span>縱深防禦</span></div><div class="flip__face flip__back"><span>四道獨立的牆 —— 攻擊者得全部攻破。</span></div></div></button></div>
