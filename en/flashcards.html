<header class="page-head"><h1>Flashcards</h1><p class="page-head__sub">Tap a card to flip it. Term on the front, meaning on the back.</p></header><div class="flip-grid" id="flips"><button class="flip" type="button" data-item="" aria-pressed="false"><div class="flip__inner"><div class="flip__face flip__front"><span>Namespace</span></div><div class="flip__face flip__back"><span>Isolates WHAT a process can see (PID / network / mount / UTS).</span></div></div></button><button class="flip" type="button" data-item="" aria-pressed="false"><div class="flip__inner"><div class="flip__face flip__front"><span>Cgroup</span></div><div class="flip__face flip__back"><span>Caps HOW MUCH a process can use (CPU / memory / I/O / PIDs).</span></div></div></button><button class="flip" type="button" data-item="" aria-pressed="false"><div class="flip__inner"><div class="flip__face flip__front"><span>Seccomp-BPF</span></div><div class="flip__face flip__back"><span>Filters which syscalls a process may make — before they run.</span></div></div></button><button class="flip" type="button" data-item="" aria-pressed="false"><div class="flip__inner"><div class="flip__face flip__front"><span>Timeout</span></div><div class="flip__face flip__back"><span>Caps HOW LONG a job may run; kills runaways.</span></div></div></button><button class="flip" type="button" data-item="" aria-pressed="false"><div class="flip__inner"><div class="flip__face flip__front"><span>Sandbox Executor</span></div><div class="flip__face flip__back"><span>The security core where untrusted code actually runs.</span></div></div></button><button class="flip" type="button" data-item="" aria-pressed="false"><div class="flip__inner"><div class="flip__face flip__front"><span>Job Manager</span></div><div class="flip__face flip__back"><span>Dispatches tasks to nodes, monitors them, returns results.</span></div></div></button><button class="flip" type="button" data-item="" aria-pressed="false"><div class="flip__inner"><div class="flip__face flip__front"><span>Database role</span></div><div class="flip__face flip__back"><span>Holds Jobs, Results and Logs — the shared source of truth.</span></div></div></button><button class="flip" type="button" data-item="" aria-pressed="false"><div class="flip__inner"><div class="flip__face flip__front"><span>OOM killer</span></div><div class="flip__face flip__back"><span>Kills a process when memory runs out; cgroup memory.max can trigger it.</span></div></div></button><button class="flip" type="button" data-item="" aria-pressed="false"><div class="flip__inner"><div class="flip__face flip__front"><span>TOCTOU</span></div><div class="flip__face flip__back"><span>Check-to-use race; seccomp-BPF avoids it by not dereferencing pointers.</span></div></div></button><button class="flip" type="button" data-item="" aria-pressed="false"><div class="flip__inner"><div class="flip__face flip__front"><span>Defense in depth</span></div><div class="flip__face flip__back"><span>Four independent walls — an attacker must beat all of them.</span></div></div></button></div>
